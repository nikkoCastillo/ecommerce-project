{% extends "base.html" %}

{% block title %}{{ page_title }} | E-commerce Demo{% endblock %}

{% block content %}
    <h1>{{ page_title }}</h1>
    <form method="post" action="{{ form_action }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
        <label for="name">Product name</label>
        <input id="name" name="name" type="text"
               value="{{ product[1] if product else '' }}" required>
    
        <label for="category">Category</label>
        <input id="category" name="category" type="text"
               value="{{ product[2] if product else '' }}" required>
    
        <label for="price">Price</label>
        <input id="price" name="price" type="number" min="0.01" step="0.01"
               value="{{ product[3] if product else '' }}" required>
    
        <button type="submit">{{ page_title }}</button>
    </form>

    <p><a href="{{ url_for('products.index') }}">Back to products</a></p>
{% endblock %}
